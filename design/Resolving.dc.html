<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .scr { --ground:#F2F3EF; --surface:#FFFFFF; --surface2:#E9EBE4; --ink:#161A17; --ink2:#565E58; --ink3:#7C847D; --rule:#D5D9CF; --heavy:#161A17; --est:#9E5A0A; --estbg:#F6EADA; --det:#0C6558; --detbg:#DFEDE9; }
    .scr.dark { --ground:#131614; --surface:#1B1F1C; --surface2:#242926; --ink:#E9ECE6; --ink2:#A2AAA4; --ink3:#79817B; --rule:#2F342F; --heavy:#E9ECE6; --est:#E4A24E; --estbg:#2B2117; --det:#5FC4B2; --detbg:#142925; }
    a { color: #9E5A0A; } a:hover { color: #7A4508; }
    @keyframes shim { 0% { opacity: .38; } 50% { opacity: .85; } 100% { opacity: .38; } }
    .sk { animation: shim 1.35s ease-in-out infinite; }
    .sk2 { animation-delay: .18s; }
    .sk3 { animation-delay: .36s; }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; opacity: .6; } }
  </style>
</helmet>

<div class="scr {{theme}}" style="width: 390px; height: 844px; background: var(--ground); color: var(--ink); font-family: 'Source Serif 4', Georgia, serif; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; position: relative;">

  <div style="position: absolute; inset: 0; background: var(--ink); opacity: 0.28;"></div>

  <div style="position: relative; background: var(--ground); border-top: 6px solid var(--heavy); display: flex; flex-direction: column; height: 620px;">

    <div style="display: flex; justify-content: center; padding: 9px 0 0;">
      <div style="width: 42px; height: 4px; background: var(--rule);"></div>
    </div>

    <div style="padding: 14px 20px 14px;">
      <div style="display: flex; align-items: center; gap: 9px; padding-bottom: 10px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--est)" stroke-width="2.2" stroke-linecap="round" class="sk">
          <path d="M12 3v3.5M12 17.5V21M21 12h-3.5M6.5 12H3M18.4 5.6l-2.5 2.5M8.1 15.9l-2.5 2.5M18.4 18.4l-2.5-2.5M8.1 8.1L5.6 5.6"></path>
        </svg>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: var(--est);">READING YOUR MEAL</span>
      </div>
      <div style="font-size: 18px; line-height: 1.4; color: var(--ink2); font-style: italic;">"two rotis, dal and a bowl of curd"</div>
    </div>

    <div style="height: 2px; background: var(--rule);"></div>

    <div style="flex-grow: 1; padding: 0 20px;">

      <div style="display: flex; align-items: center; gap: 14px; padding: 17px 0; border-bottom: 1px solid var(--rule);">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
          <div class="sk" style="height: 15px; width: 58%; background: var(--surface2);"></div>
          <div class="sk sk2" style="height: 11px; width: 34%; background: var(--surface2);"></div>
        </div>
        <div class="sk" style="height: 15px; width: 40px; background: var(--surface2); flex: none;"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 17px 0; border-bottom: 1px solid var(--rule);">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
          <div class="sk sk2" style="height: 15px; width: 44%; background: var(--surface2);"></div>
          <div class="sk sk3" style="height: 11px; width: 41%; background: var(--surface2);"></div>
        </div>
        <div class="sk sk2" style="height: 15px; width: 40px; background: var(--surface2); flex: none;"></div>
      </div>

      <div style="display: flex; align-items: center; gap: 14px; padding: 17px 0; border-bottom: 1px solid var(--rule);">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
          <div class="sk sk3" style="height: 15px; width: 50%; background: var(--surface2);"></div>
          <div class="sk" style="height: 11px; width: 28%; background: var(--surface2);"></div>
        </div>
        <div class="sk sk3" style="height: 15px; width: 40px; background: var(--surface2); flex: none;"></div>
      </div>

      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 26px 0 0;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink3);">matching against 8,412 foods</span>
      </div>
    </div>

    <div style="padding: 0 20px 26px;">
      <div style="height: 52px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink3); display: flex; align-items: center; justify-content: center;">
        <span style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 15.5px;">Add to today</span>
      </div>
    </div>

  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
